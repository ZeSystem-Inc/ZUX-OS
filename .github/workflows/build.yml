name: ZUX OS Debian Graphical Offline ISO Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cpio xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools e2fsprogs fdisk debootstrap squashfs-tools libgtk-3-dev pkg-config

      - name: Cache Debian Base RootFS
        id: cache-debian
        uses: actions/cache@v4
        with:
          path: build_dir/debian_root
          key: debian-bookworm-gui-v1

      - name: Create Base Debian RootFS (Stage 1)
        if: steps.cache-debian.outputs.cache-hit != 'true'
        run: |
          mkdir -p build_dir/debian_root
          sudo debootstrap --variant=minbase --include=linux-image-amd64,grub-pc,e2fsprogs,util-linux,fdisk,systemd,kmod,udev,busybox bookworm build_dir/debian_root http://deb.debian.org/debian/

      - name: Mount Pseudo Filesystems and Install GUI Packages (Stage 2)
        if: steps.cache-debian.outputs.cache-hit != 'true'
        run: |
          sudo mount --bind /dev build_dir/debian_root/dev
          sudo mount --bind /proc build_dir/debian_root/proc
          sudo mount --bind /sys build_dir/debian_root/sys

          sudo chroot build_dir/debian_root sh -c "apt-get update && apt-get install -y --no-install-recommends xorg openbox libgtk-3-0 dconf-gsettings-backend"

          sudo umount build_dir/debian_root/dev
          sudo umount build_dir/debian_root/proc
          sudo umount build_dir/debian_root/sys

      - name: Configure Debian Base Environment
        run: |
          sudo chroot build_dir/debian_root sh -c "echo 'zux-os' > /etc/hostname"
          sudo chroot build_dir/debian_root sh -c "echo 'root:zux' | chpasswd"

      - name: Build Local Initrd and ISO Tree
        run: |
          mkdir -p build_dir/iso_root/boot/grub
          mkdir -p build_dir/release_assets
          
          mkdir -p build_dir/initrd_root
          sudo cp -a build_dir/debian_root/* build_dir/initrd_root/
          
          sudo mkdir -p build_dir/initrd_root/installer
          sudo mkdir -p build_dir/initrd_root/rootfs
          
          sudo cp -a build_dir/debian_root/* build_dir/initrd_root/rootfs/

      - name: Compile Init & Setup Binaries
        run: |
          if [ -f setup.c ]; then
            gcc -O2 -s setup.c `pkg-config --cflags --libs gtk+-3.0` -o setup.elf
            sudo cp setup.elf build_dir/initrd_root/installer/setup.elf
          fi
          if [ -f init.c ]; then
            gcc -O2 -s static init.c -o init_bin 2>/dev/null || gcc -O2 -s init.c -o init_bin
            sudo cp init_bin build_dir/initrd_root/init
          fi

      - name: Extract Kernel & Create Initrd
        run: |
          KERNEL_PATH=$(ls -1 build_dir/debian_root/boot/vmlinuz-* | head -n 1)
          sudo cp "$KERNEL_PATH" build_dir/iso_root/boot/vmlinuz
          sudo chmod 644 build_dir/iso_root/boot/vmlinuz

          WORKSPACE_DIR=$(pwd)
          cd build_dir/initrd_root
          sudo find . -print0 | sudo cpio --null -ov --format=newc | gzip -9 > ../iso_root/boot/initrd.img
          cd "${WORKSPACE_DIR}"

      - name: Configure GRUB Menu
        run: |
          cat << 'EOF' > build_dir/iso_root/boot/grub/grub.cfg
          set default=0
          set timeout=3

          menuentry "ZUX OS (Debian GUI) Offline Installer" {
              linux /boot/vmlinuz console=tty1 nomodeset quiet loglevel=3
              initrd /boot/initrd.img
          }
          EOF

      - name: Generate Offline ISO Image
        run: |
          grub-mkrescue -o build_dir/release_assets/ZUX-Debian-GUI-Offline.iso build_dir/iso_root

      - name: Publish Release Asset
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "gui-offline-v1.0"
          name: "ZUX OS Debian Graphical Offline Release 1.0"
          draft: false
          prerelease: false
          files: build_dir/release_assets/ZUX-Debian-GUI-Offline.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
