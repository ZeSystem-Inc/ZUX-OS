name: ZUX OS Debian Offline ISO Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cpio xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools e2fsprogs fdisk debootstrap squashfs-tools

      - name: Create Base Debian RootFS (debootstrap)
        run: |
          sudo debootstrap --variant=minbase --include=linux-image-amd64,grub-pc,e2fsprogs,util-linux,fdisk,systemd,kmod,udev,busybox bookworm build_dir/debian_root http://deb.debian.org/debian/

      - name: Configure Debian Base Environment
        run: |
          sudo chroot build_dir/debian_root sh -c "echo 'zux-os' > /etc/hostname"
          sudo chroot build_dir/debian_root sh -c "echo 'root:zux' | chpasswd"

      - name: Build Local Initrd and ISO Tree
        run: |
          mkdir -p build_dir/iso_root/boot/grub
          mkdir -p build_dir/release_assets
          
          mkdir -p build_dir/initrd_root
          sudo cp -a build_dir/debian_root/* build_dir/initrd_root/
          
          sudo mkdir -p build_dir/initrd_root/installer
          sudo mkdir -p build_dir/initrd_root/rootfs
          
          sudo cp -a build_dir/debian_root/* build_dir/initrd_root/rootfs/

      - name: Compile Init & Setup Binaries
        run: |
          if [ -f setup.c ]; then
            gcc -O2 -s -static -Wno-unused-result -Wno-format-truncation setup.c -o setup.elf
            sudo cp setup.elf build_dir/initrd_root/installer/setup.elf
          fi
          if [ -f init.c ]; then
            gcc -O2 -s -static -Wno-unused-result -Wno-format-truncation init.c -o init_bin
            sudo cp init_bin build_dir/initrd_root/init
          fi

      - name: Extract Kernel & Create Initrd
        run: |
          KERNEL_PATH=$(ls -1 build_dir/debian_root/boot/vmlinuz-* | head -n 1)
          sudo cp "$KERNEL_PATH" build_dir/iso_root/boot/vmlinuz
          sudo chmod 644 build_dir/iso_root/boot/vmlinuz

          WORKSPACE_DIR=$(pwd)
          cd build_dir/initrd_root
          sudo find . -print0 | sudo cpio --null -ov --format=newc | gzip -9 > ../iso_root/boot/initrd.img
          cd "${WORKSPACE_DIR}"

      - name: Configure GRUB Menu
        run: |
          cat << 'EOF' > build_dir/iso_root/boot/grub/grub.cfg
          set default=0
          set timeout=3

          menuentry "ZUX OS (Debian Base) Offline Installer" {
              linux /boot/vmlinuz console=tty1 nomodeset quiet loglevel=3
              initrd /boot/initrd.img
          }
          EOF

      - name: Generate Offline ISO Image
        run: |
          grub-mkrescue -o build_dir/release_assets/ZUX-Debian-Offline.iso build_dir/iso_root

      - name: Publish Release Asset
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "debian-offline-v1.0"
          name: "ZUX OS Debian Offline Release 1.0"
          draft: false
          prerelease: false
          files: build_dir/release_assets/ZUX-Debian-Offline.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
